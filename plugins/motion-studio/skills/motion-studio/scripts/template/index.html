<!doctype html>
<html>
<head>
<meta charset="utf-8">
<title>Motion scene</title>
<style>
  html, body { margin: 0; background: #111; }
  body.preview { display: flex; flex-direction: column; align-items: center; justify-content: center; min-height: 100vh; gap: 10px; }
  body.preview canvas { max-height: 86vh; max-width: 96vw; width: auto; height: auto; }
  #ctl { color: #ccc; font: 13px -apple-system, sans-serif; display: none; gap: 10px; align-items: center; }
  body.preview #ctl { display: flex; }
  #scrub { width: 50vw; }
</style>
</head>
<body>
<canvas id="c"></canvas>
<div id="ctl"><button id="pp">Pause</button><input id="scrub" type="range" min="0" step="0.0333" value="0"><span id="tc">0.00</span>
  <label><input id="guides" type="checkbox"> safe zones</label></div>
<script src="scene.js"></script>
</body>
</html>
